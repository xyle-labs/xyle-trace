[project]
name = "xyle-trace"
version = "0.1.0"
description = "Agent-native data lineage and provenance toolkit: record sources, snapshots, transformations, and evidence-backed claims as a queryable graph."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Xyle Labs", email = "jesse@xyle.de" }]
keywords = ["lineage", "provenance", "mcp", "agents", "data-science", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pydantic>=2.5.2,<3", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/xyle-labs/xyle-trace"
Source = "https://github.com/xyle-labs/xyle-trace"
Issues = "https://github.com/xyle-labs/xyle-trace/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
mcp = ["mcp>=2,<3"]

[project.scripts]
xyle-trace = "xyle_trace.cli.main:main"
xyle-trace-mcp = "xyle_trace.mcp.__main__:main"
xyle-trace-run = "xyle_trace.cli.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xyle_trace"]

# `xyle-trace new` installs these into a consuming project, so they must be
# available from an installed wheel and not only from a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "xyle_trace/skills"

# Source distributions contain only maintained public source and documentation.
# A new top-level file must be deliberately included before it can be published.
[tool.hatch.build.targets.sdist]
include = [
    "/src", "/skills", "/tests", "/examples", "/docs", "/scripts",
    "/README.md", "/ROADMAP.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CLAUDE.md",
    "/LICENSE", "/NOTICE", "/pyproject.toml", "/.gitignore", "/.gitleaks.toml",
    "/.githooks", "/.github", "/.claude-plugin", "/.mcp.json", "/.claude/settings.json",
]

[tool.hatch.build]
exclude = [".superpowers", ".codex", ".agents", ".lineage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
