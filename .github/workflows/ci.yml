name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m xyle_trace.cli.main --help
      - run: xyle-trace-run --help
      - run: xyle-trace-mcp --help

  core-only:
    # The base install must work with the four MCP test modules skipped. This is
    # a supported configuration, so it is tested rather than asserted.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: xyle-trace --help
      - run: xyle-trace-run --help

  installed-distribution:
    # Validate packaged skills and demo from a wheel outside the source tree.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
      - run: pip install "$RUNNER_TEMP"/wheels/xyle_trace-*.whl
      - name: Exercise installed onboarding and capture without MCP
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tests/cli/installed_smoke.py"
